services:
  backend:
    build: ./backend
    container_name: pocketflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/finance.db
    networks:
      - proxy-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=${BACKEND_URL}
    container_name: pocketflow_frontend
    ports:
      - "8001:80"  # Web-Oberfläche ist unter http://localhost:3000 erreichbar
    depends_on:
      - backend
    networks:
      - proxy-network
    restart: unless-stopped

volumes:
  backend_data:

networks:
  proxy-network:
    name: ${PROXY_NETWORK_NAME}
    external: true